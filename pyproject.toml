[project]
name = "azurpilot"
version = "1.0.0"
requires-python = ">=3.14.6,<3.14.14"
dependencies = [
    "numpy==2.5.5",
    "scipy==1.18.1",
    "pillow==13.0.0",
    "opencv-python==5.1.0.95",
    "imageio==2.38.2",
    "imageio-ffmpeg==0.8.1",
    "adbutils==2.12.0",
    "uiautomator2==2.16.26",
    "uiautomator2cache==0.3.1",
    "jellyfish==1.3.0",
    "pyyaml==6.0.4",
    "inflection==0.5.1",
    "starlette==1.10.0",
    "anyio==4.16.0",
    "uvicorn[standard]==0.54.0",
    "flask==3.1.3",
    "aiohttp>=3.13.2",
    "aiortc>=1.14.0",
    "pypresence==4.6.2",
    "rich>=13.7.0",
    "zerorpc==0.6.3",
    "pyzmq==27.3.0",
    "onepush==1.10.0",
    "psutil==7.2.2",
    "matplotlib==3.11.2",
    "pycryptodome==4.5.0",
    "pydantic>=2.12.5",
    "rapidocr==3.9.2",
    "ncnn>=1.0.20260114",
    "onnxruntime-windowsml==1.30.1.202610302006; sys_platform == 'win32'",
    "windowsml==2.5.96; sys_platform == 'win32'",
    "onnxruntime==1.32.0; sys_platform == 'linux'",
    "onnxruntime==1.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numba==0.68.1",
    "uv==0.13.9",
    "lz4==4.4.5",
    "packaging==26.3",
    "openai==3.57.0",
    "mcp==1.30.0",
    "textual>=0.80.0",
    "cryptography>=49.0.0",
    "keyring>=25.6.0",
    "portalocker>=3.2.0",
    "openpyxl>=3.1.5,<4",
    "pyflared==0.1.0",
    "niquests>=3.21.2,<4",
]

[dependency-groups]
dev = [
    "ruff",
    # tests/shop_event/ 使用 pytest 编写
    "pytest",
    # dev_tools 脚本依赖
    "pandas",
    "pyperclip",
]

[tool.uv]
# 直接运行与启动器使用同一个项目缓存，避免依赖 Windows 全局缓存的权限。
cache-dir = ".uv-cache"
index = [
    # 云厂商镜像
    { url = "https://mirrors.aliyun.com/pypi/simple/" },
    { url = "https://mirrors.cloud.tencent.com/pypi/simple/" },
    { url = "https://repo.huaweicloud.com/repository/pypi/simple/" },
    ]
index-url = "https://pypi.org/simple/"
package = false
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
# tests/ 不是包，pytest 需要仓库根目录在 sys.path 才能导入 module/
pythonpath = ["."]
